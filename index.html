<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رعاية مالك">
<meta name="theme-color" content="#fbf5f2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>رعاية مالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: one-thumb app. Calm summary on top, three big daily actions fixed at the bottom, undo bar just above them. */
:root {
  --bg: #fbf5f2; --surface: #ffffff; --soft: #f5ebe6; --line: #efe2dc; --fg: #2b1f24; --muted: #7d6870;
  --nursing: #c9566c; --bottle: #d9853b; --pump: #8a6cc4; --diaper: #2f978d; --sleep: #5466c4; --warn: #b3392b;
  --on-color: #ffffff; --tint: 0.13;
  --font-body: "IBM Plex Sans Arabic", "Geeza Pro", "SF Arabic", system-ui, sans-serif;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", "Geeza Pro", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #0e0c0d; --soft: #141113; --line: #1d191b; --fg: #d9cfd2; --muted: #85777c;
  --nursing: #8f4554; --bottle: #8c5a2f; --pump: #5e4c86; --diaper: #2a6a64; --sleep: #3c4884; --warn: #b05a4e;
  --on-color: #eadfe2; --tint: 0.22; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0e0c0d; --soft: #141113; --line: #1d191b; --fg: #d9cfd2; --muted: #85777c;
  --nursing: #8f4554; --bottle: #8c5a2f; --pump: #5e4c86; --diaper: #2a6a64; --sleep: #3c4884; --warn: #b05a4e;
  --on-color: #eadfe2; --tint: 0.22; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 18px; line-height: 1.5; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sleep); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.clk { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.tintbg { background: color-mix(in srgb, var(--c) calc(var(--tint) * 100%), var(--surface)); }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 280px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; align-items: center; gap: 8px; }
.head .who { flex: 1; min-width: 0; }
.hello { color: var(--muted); font-size: 16px; margin: 0; }
.baby { font-family: var(--font-display); font-size: 38px; line-height: 1.15; margin: 0; }
.age { color: var(--muted); font-size: 15px; margin: 0; }
.iconbtn { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); background: var(--surface); border: 1px solid var(--line); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }

/* Hero: what a tired parent needs first */
.hero { border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 6px; --c: var(--nursing); }
.hero .k { font-size: 15px; font-weight: 700; color: var(--c); margin: 0; }
.hero .v { font-size: 30px; font-weight: 700; line-height: 1.25; margin: 0; }
.hero .s { margin: 0; color: var(--muted); font-size: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; background: var(--c); color: var(--on-color); font-weight: 700; font-size: 15px; }

.live { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; width: 100%; text-align: start; border: 2px solid var(--c); }
.live .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); animation: pulse 1.6s ease-in-out infinite; flex: none; }
.live .txt { flex: 1; min-width: 0; }
.live b { display: block; }
.live small { color: var(--muted); font-size: 14px; }
.live .clock { font-size: 26px; font-weight: 700; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } }

.today { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; display: grid; grid-template-columns: repeat(3, 1fr); }
.today div { padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.today div + div { border-inline-start: 1px solid var(--line); }
.today b { font-size: 24px; line-height: 1.2; }
.today span { font-size: 13.5px; color: var(--muted); }
.today em { font-style: normal; font-size: 12.5px; color: var(--muted); }

.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0; }
.sec h3 { margin: 0; font-size: 17px; }
.sec button { color: var(--sleep); font-weight: 700; font-size: 15px; min-height: 40px; }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: start; border-bottom: 1px solid var(--line); min-height: 64px; }
.row:last-child { border-bottom: 0; }
.row .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--c); flex: none; }
.row .ic svg { width: 20px; height: 20px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 700; }
.row .mid span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.row .when { color: var(--muted); font-size: 14px; flex: none; text-align: end; }
.row .edit { font-size: 13px; color: var(--sleep); font-weight: 700; display: block; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; margin: 0; }

/* Bottom action pad */
.pad { position: fixed; inset-inline: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.pad-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.act { grid-column: span 2; min-height: 104px; border-radius: 26px; background: var(--c); color: var(--on-color); font-size: 19px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; transition: transform .1s; }
.act svg { width: 32px; height: 32px; }
.act.small { grid-column: span 3; min-height: 56px; flex-direction: row; font-size: 17px; background: color-mix(in srgb, var(--c) calc(var(--tint) * 100%), var(--surface)); color: var(--c); }
.act.small svg { width: 24px; height: 24px; }
.act:active, .big:active { transform: scale(.96); }

.big { min-height: 68px; border-radius: 22px; background: var(--c); color: var(--on-color); font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px; width: 100%; transition: transform .1s; }
.big svg { width: 26px; height: 26px; flex: none; }
.big.soft { background: color-mix(in srgb, var(--c) calc(var(--tint) * 100%), var(--surface)); color: var(--c); }
.big[disabled] { opacity: .45; }
.ghost { width: 100%; min-height: 50px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ghost svg { width: 20px; height: 20px; }
.danger { color: var(--warn); min-height: 48px; font-weight: 700; width: 100%; }

/* Undo bar */
.undo { position: fixed; inset-inline: 16px; bottom: calc(var(--padh, 190px) + 10px); z-index: 30; max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 10px; background: var(--fg); color: var(--bg); border-radius: 18px; padding: 8px 8px 8px 8px; padding-inline-start: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.undo span { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; }
.undo button { min-height: 48px; padding-inline: 18px; border-radius: 13px; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.undo button svg { width: 20px; height: 20px; }

/* Sheets */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; }
.sheet-bar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px; border-bottom: 1px solid var(--line); }
.sheet-bar h2 { flex: 1; margin: 0; font-size: 19px; text-align: center; }
.sheet-bar .side { width: 84px; display: flex; }
.sheet-bar button { min-height: 44px; padding-inline: 10px; color: var(--sleep); font-weight: 700; }
.sheet-body { flex: 1; overflow-y: auto; padding-inline: 16px; padding-block: 18px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 560px; width: 100%; margin: 0 auto; }
.sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.label { font-weight: 700; color: var(--muted); font-size: 15px; margin: 0; }

.hint { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; font-weight: 500; margin: 0; }
.bigclock { font-size: 66px; font-weight: 700; text-align: center; line-height: 1.1; margin: 0; display: block; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side-btn { min-height: 210px; border-radius: 30px; background: color-mix(in srgb, var(--nursing) calc(var(--tint) * 100%), var(--surface)); color: var(--nursing); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 3px solid transparent; }
.side-btn.on { background: var(--nursing); color: var(--on-color); }
.side-btn.next { border-color: var(--nursing); }
.side-btn svg { width: 36px; height: 36px; }
.side-btn .nm { font-size: 25px; font-weight: 700; }
.side-btn .t { font-size: 20px; }
.chip { font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 99px; background: color-mix(in srgb, currentColor 18%, transparent); }
.subtle { color: var(--muted); text-align: center; font-size: 15px; margin: 0; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 5px; }
.seg button { min-height: 50px; border-radius: 14px; font-weight: 700; }
.seg button.on { background: var(--c); color: var(--on-color); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 46px; padding-inline: 16px; border-radius: 99px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); }
.chips button.on { background: var(--c); color: var(--on-color); border-color: var(--c); }

.stepper { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 12px; }
.stepper .round { width: 70px; height: 70px; border-radius: 50%; background: color-mix(in srgb, var(--c) calc(var(--tint) * 100%), var(--surface)); color: var(--c); display: grid; place-items: center; flex: none; }
.stepper .round svg { width: 30px; height: 30px; }
.stepper .mid { flex: 1; text-align: center; min-width: 0; }
.stepper .amt { font-size: 44px; font-weight: 700; line-height: 1.1; display: block; }
.stepper .unit { color: var(--muted); font-weight: 500; }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.quick button { min-height: 50px; border-radius: 16px; font-weight: 700; background: color-mix(in srgb, var(--c) calc(var(--tint) * 100%), var(--surface)); color: var(--c); }
.quick button.on { background: var(--c); color: var(--on-color); }

.field { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.field label { font-weight: 700; flex: 1; min-width: 6em; }
.field input { background: transparent; border: 0; min-height: 42px; text-align: end; max-width: 100%; }
.field input[type="datetime-local"], .field input[type="date"] { direction: ltr; }
.field.col { flex-direction: column; align-items: stretch; gap: 2px; }
.field.col input { text-align: start; }
textarea { width: 100%; min-height: 80px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; resize: vertical; }

.kinds { display: flex; flex-direction: column; gap: 12px; }
.kind { min-height: 92px; border-radius: 26px; display: flex; align-items: center; gap: 16px; padding-inline: 22px; font-size: 22px; font-weight: 700; background: color-mix(in srgb, var(--diaper) calc(var(--tint) * 100%), var(--surface)); color: var(--diaper); width: 100%; text-align: start; }
.kind svg { width: 34px; height: 34px; flex: none; }
.kind small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.kind.on { background: var(--diaper); color: var(--on-color); }
.kind.on small { color: var(--on-color); opacity: .8; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.swatch { min-height: 84px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; }
.swatch i { width: 34px; height: 34px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); }
.swatch.on { border: 2px solid var(--diaper); background: color-mix(in srgb, var(--diaper) calc(var(--tint) * 100%), var(--surface)); }
.warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 16px; padding: 12px 14px; font-weight: 500; margin: 0; }

.day { display: flex; flex-direction: column; gap: 8px; }
.day-h { display: flex; flex-direction: column; padding-inline: 4px; }
.day-h b { font-size: 17px; }
.day-h span { color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; z-index: 40; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>


<div id="app" dir="rtl" lang="ar"></div>
<div id="pad" class="pad" dir="rtl" lang="ar"></div>
<div id="sheet" dir="rtl" lang="ar" hidden></div>
<div id="undo" class="undo" dir="rtl" lang="ar" role="status" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  document.documentElement.setAttribute("dir", "rtl");
  document.documentElement.setAttribute("lang", "ar");

  // ---------- Icons ----------
  const I = {
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>',
    drop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5S5 10.2 5 14.6A7 7 0 0 0 19 14.6C19 10.2 12 2.5 12 2.5z"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
    bottle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 2h4v2.2l1.6 2.3c.3.4.4.9.4 1.4V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V7.9c0-.5.1-1 .4-1.4L10 4.2V2zm-1 9v2h6v-2H9z"/></svg>',
    pump: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7.5s-3 3.3-3 5.2a3 3 0 0 0 6 0c0-1.9-3-5.2-3-5.2z" fill="currentColor" stroke="none"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7"/><path d="M4 4v4.7h4.7"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4l3 3-3 3M20 7H8M7 20l-3-3 3-3M4 17h12"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    circle: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>',
    half: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>'
  };

  // ---------- Storage (on this phone only) ----------
  const KEY = "malik-care-v1", UKEY = "malik-care-undo";
  const DEFAULT = { v: 1, feeds: [], diapers: [], sleeps: [],
    settings: { baby: "مالك", mother: "نشوى", birth: "", unit: "ml", theme: "system" } };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function normalize(d) {
    return Object.assign({}, clone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, (d && d.settings) || {}) });
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
    return clone(DEFAULT);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  let S = load();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // Undo: every change first saves a snapshot, so any mistake can be reversed.
  let undoStack = [];
  try { undoStack = JSON.parse(localStorage.getItem(UKEY) || "[]"); } catch (e) { undoStack = []; }
  function saveUndo() { try { localStorage.setItem(UKEY, JSON.stringify(undoStack.slice(-15))); } catch (e) {} }
  function change(label, fn) {
    undoStack.push({ label, data: JSON.stringify(S) });
    if (undoStack.length > 15) undoStack.shift();
    fn();

  function undo() {

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => Date.now();

  // ---------- Arabic formatting ----------
  const AR = "٠١٢٣٤٥٦٧٨٩";
  const dg = (s) => String(s).replace(/[0-9]/g, (d) => AR[d]);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad2 = (n) => String(n).padStart(2, "0");
  function clock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return dg(h > 0 ? h + ":" + pad2(m) + ":" + pad2(s) : pad2(m) + ":" + pad2(s));
  }
  function dur(sec) {
    const mins = Math.floor(Math.max(0, sec) / 60);
    if (mins < 1) return "أقل من دقيقة";
    const h = Math.floor(mins / 60), m = mins % 60;
    if (!h) return dg(m) + " د";
    if (!m) return dg(h) + " س";
    return dg(h) + " س " + dg(m) + " د";
  }
  const ago = (t) => { const s = (now() - t) / 1000; return s < 60 ? "الآن" : "منذ " + dur(s); };
  let timeFmt, dayFmt;
  try {
    timeFmt = new Intl.DateTimeFormat("ar-u-nu-arab", { hour: "numeric", minute: "2-digit" });
    dayFmt = new Intl.DateTimeFormat("ar-u-nu-arab", { weekday: "long", day: "numeric", month: "long" });
  } catch (e) {
    timeFmt = { format: (d) => dg(d.getHours() + ":" + pad2(d.getMinutes())) };
    dayFmt = { format: (d) => dg(d.toDateString()) };
  }
  const tm = (t) => timeFmt.format(new Date(t));
  const num = (v) => dg(Math.round(v * 10) / 10);
  const unitInfo = () => S.settings.unit === "oz"
    ? { name: "أونصة", step: 0.5, quick: [1, 2, 3, 4, 5], from: (ml) => ml / 29.5735, to: (v) => v * 29.5735 }
    : { name: "مل", step: 10, quick: [30, 60, 90, 120, 150], from: (ml) => ml, to: (v) => v };
  const vol = (ml) => { const u = unitInfo(); return num(u.from(ml || 0)) + " " + u.name; };
  function counted(n, one, two, few, many) {
    if (n === 1) return one; if (n === 2) return two;
    if (n >= 3 && n <= 10) return dg(n) + " " + few;
    return dg(n) + " " + many;
  }
  function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(t, n) { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
  function ageText() {
    if (!S.settings.birth) return "";
    const b = new Date(S.settings.birth + "T00:00:00").getTime();
    if (isNaN(b)) return "";
    const days = Math.round((startOfDay(now()) - startOfDay(b)) / 86400000);
    if (days < 0) return "";
    if (days < 1) return "مولود اليوم";
    if (days < 28) return "عمره " + counted(days, "يوم واحد", "يومان", "أيام", "يوماً");
    if (days < 91) return "عمره " + counted(Math.floor(days / 7), "أسبوع واحد", "أسبوعان", "أسابيع", "أسبوعاً");
    const a = new Date(b), n = new Date();
    let months = (n.getFullYear() - a.getFullYear()) * 12 + n.getMonth() - a.getMonth();
    if (n.getDate() < a.getDate()) months--;

  }
  function greeting() {
    const h = new Date().getHours();
    const g = h >= 4 && h < 12 ? "صباح الخير" : h < 18 && h >= 12 ? "مساء الخير" : "ليلة هادئة";
    return S.settings.mother ? g + " يا " + S.settings.mother : g;
  }
  function dayTitle(t) {
    const today = startOfDay(now());
    if (t === today) return "اليوم";
    if (t === addDays(today, -1)) return "أمس";

  }
  function toLocalInput(t) { const d = new Date(t); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function fromLocalInput(v, fallback) { const t = new Date(v).getTime(); return isNaN(t) ? fallback : Math.min(t, now()); }

  // ---------- Domain ----------
  const SIDE = { right: "اليمين", left: "اليسار" };
  const other = (s) => (s === "right" ? "left" : "right");
  const CONTENT = { breastMilk: "حليب الأم", formula: "حليب صناعي" };
  const DKIND = { wet: "مبلل", dirty: "متسخ", mixed: "مبلل ومتسخ" };
  const DICON = { wet: I.drop, dirty: I.circle, mixed: I.half };
  const COLORS = [
    ["yellow", "أصفر", "#e8c547"], ["green", "أخضر", "#6b8e3d"], ["brown", "بني", "#8b5a2b"],
    ["black", "أسود", "#222222"], ["red", "أحمر", "#c0392b"], ["pale", "أبيض أو شاحب", "#ede8da"]
  ];
  const COLOR_WARN = {
    red: "اللون الأحمر قد يعني وجود دم. يُنصح بالتواصل مع طبيب الأطفال.",
    pale: "البراز الأبيض أو الشاحب قد يدل على مشكلة في الكبد. تواصلي مع طبيب الأطفال في أقرب وقت.",
    black: "الأسود طبيعي في الأيام الأولى بعد الولادة. إن استمر بعدها، استشيري الطبيب."

  const CONS = [["watery", "سائل"], ["soft", "طري"], ["seedy", "حبيبي"], ["firm", "متماسك"], ["hard", "قاسٍ"]];
  const colorName = (k) => (COLORS.find((c) => c[0] === k) || [0, ""])[1];
  const consName = (k) => (CONS.find((c) => c[0] === k) || [0, ""])[1];

  const activeNursing = () => S.feeds.find((f) => f.kind === "nursing" && f.end == null);
  const activeSleep = () => S.sleeps.find((s) => s.end == null);
  function sideSecs(f, side, t) {
    let v = side === "right" ? f.r : f.l;
    if (f.run === side && f.since) v += Math.max(0, (t - f.since) / 1000);
    return v;
  }
  const totalSecs = (f, t) => sideSecs(f, "right", t) + sideSecs(f, "left", t);
  function pauseFeed(f, t) {
    if (f.run && f.since) { const e = Math.max(0, (t - f.since) / 1000); if (f.run === "right") f.r += e; else f.l += e; }
    f.run = null; f.since = null;
  }
  function lastNursingSide(finishedOnly) {
    const f = S.feeds.filter((x) => x.kind === "nursing" && x.last && (!finishedOnly || x.end != null)).sort((a, b) => b.start - a.start)[0];
    return f ? f.last : null;
  }
  function dayStats(day) {
    const a = day, b = addDays(day, 1), t = now();
    const feeds = S.feeds.filter((f) => f.kind !== "pump" && f.start >= a && f.start < b);
    const diapers = S.diapers.filter((d) => d.t >= a && d.t < b);
    const lim = Math.min(b, t);

    const bottle = feeds.filter((f) => f.kind === "bottle").reduce((s, f) => s + (f.ml || 0), 0);

  function allItems() {

  function findEntry(type, id) {

  }

  // ---------- Toast & undo bar ----------

  // ---------- Theme ----------
  function isDark() {

  }
  function applyTheme() {

    else document.documentElement.removeAttribute("data-theme");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", isDark() ? "#000000" : "#fbf5f2");
  }

  // ---------- Home ----------
  function rowInfo(type, e) {
    if (type === "feed") {
      if (e.kind === "nursing") return { c: "var(--nursing)", i: I.heart, title: "رضاعة طبيعية", sub: e.end == null ? "جارية الآن" : "يمين " + dur(e.r) + " · يسار " + dur(e.l) };
      if (e.kind === "bottle") return { c: "var(--bottle)", i: I.bottle, title: "رضّاعة", sub: vol(e.ml) + " · " + CONTENT[e.content || "breastMilk"] };

    }
    if (type === "diaper") {
      const parts = [colorName(e.color), consName(e.cons), e.note ? esc(e.note) : ""].filter(Boolean);
      return { c: "var(--diaper)", i: DICON[e.kind] || I.drop, title: "حفاض " + DKIND[e.kind], sub: parts.join(" · ") };
    }
    return { c: "var(--sleep)", i: I.moon, title: "نوم", sub: e.end == null ? "نائم الآن" : dur((e.end - e.start) / 1000) + " · حتى " + tm(e.end) };
  }
  function rowHtml(it, showAgo) {

      '<span class="when num">' + (showAgo ? ago(it.t) : tm(it.t)) + '<span class="edit">تعديل</span></span></button>';

  function renderHome() {
    const t = now(), st = dayStats(startOfDay(t));
    const nurse = activeNursing(), sl = activeSleep();
    const lastFeed = S.feeds.filter((f) => f.kind !== "pump").sort((a, b) => b.start - a.start)[0];
    const lastSide = lastNursingSide(false);
    const age = ageText();
    let h = '<header class="head"><div class="who">' +
      '<p class="hello">' + esc(greeting()) + '</p>' +
      '<h1 class="baby">' + esc(S.settings.baby) + '</h1>' +

      '<button class="iconbtn" data-act="toggle-night" aria-label="' + (isDark() ? "الوضع النهاري" : "الوضع الليلي") + '">' + (isDark() ? I.sun : I.moon) + '</button>' +

  // ---------- Sheets ----------

  function renderSheet() {

  function sheetNursing() {
    const f = activeNursing(), t = now(), prev = lastNursingSide(true);
    const next = !f && prev ? other(prev) : null;
    let b = "";
    if (!f && prev) b += '<p class="hint">آخر رضعة انتهت على ' + SIDE[prev] + '، فابدئي بـ' + SIDE[other(prev)] + '.</p>';
    b += '<span class="bigclock num clk" data-tick="nurse">' + clock(f ? totalSecs(f, t) : 0) + '</span>';
    b += '<div class="sides">' + ["right", "left"].map((side) => {
      const on = f && f.run === side;
      return '<button class="side-btn' + (on ? " on" : "") + (next === side ? " next" : "") + '" data-act="nurse-side" data-side="' + side + '" aria-label="' + SIDE[side] + '">' +
        (on ? I.pause : I.play) + '<span class="nm">' + SIDE[side] + '</span><span class="t num clk" data-tick="side-' + side + '">' + clock(f ? sideSecs(f, side, t) : 0) + '</span>' +
        (next === side ? '<span class="chip">التالية</span>' : '') + '</button>';
    }).join("") + '</div>';
    b += '<p class="subtle">' + (!f ? "اضغطي على الجهة لبدء المؤقت" : f.run ? "اضغطي على الجهة الأخرى للتبديل، أو نفس الجهة للإيقاف المؤقت" : "متوقف مؤقتاً. اضغطي على جهة للمتابعة") + '</p>';
    if (f) {
      b += '<div class="tools">' +
        '<button class="ghost" data-act="nurse-reset">' + I.reset + 'تصفير المؤقت</button>' +
        '<button class="ghost" data-act="nurse-swap"' + ((f.r || 0) + (f.l || 0) + (f.run ? 1 : 0) ? "" : " disabled") + '>' + I.swap + 'بدّلي الجهتين</button></div>';
    }
    const foot = f ? saveBtn("var(--nursing)", "انتهت الرضعة، احفظي") + confirmBtn("cancel-nurse", "إلغاء هذه الرضعة") : "";
    return frame("رضاعة طبيعية", b, foot);
  }

  function sheetBottle() {
    const b = seg("content", [["breastMilk", "حليب الأم"], ["formula", "حليب صناعي"]], "var(--bottle)") +
      stepper("ml", "var(--bottle)", "الكمية") + quick("ml", "var(--bottle)") + whenPicker("var(--bottle)");
    return frame("رضّاعة", b, saveBtn("var(--bottle)", "حفظ", !(D.ml > 0)));
  }

  function sheetPump() {
    const b = stepper("rml", "var(--pump)", "الجهة اليمنى") + stepper("lml", "var(--pump)", "الجهة اليسرى") +
      '<p class="hint">المجموع: <span class="num">' + vol((D.rml || 0) + (D.lml || 0)) + '</span></p>' +
      minStepper("mins", "var(--pump)", "المدة", 5) + whenPicker("var(--pump)");
    return frame("شفط الحليب", b, saveBtn("var(--pump)", "حفظ", !((D.rml || 0) + (D.lml || 0) > 0)));
  }

  function stoolFields() {
    let b = '<p class="label">لون البراز (اختياري)</p><div class="swatches">' + COLORS.map((c) =>
      '<button class="swatch' + (D.color === c[0] ? " on" : "") + '" data-act="toggle" data-key="color" data-val="' + c[0] + '"><i style="background:' + c[2] + '"></i>' + c[1] + '</button>').join("") + '</div>';
    if (D.color && COLOR_WARN[D.color]) b += '<p class="warnbox">' + COLOR_WARN[D.color] + '</p>';
    b += '<p class="label">القوام (اختياري)</p><div class="chips" style="--c:var(--diaper)">' + CONS.map((c) =>
      '<button class="' + (D.cons === c[0] ? "on" : "") + '" data-act="toggle" data-key="cons" data-val="' + c[0] + '">' + c[1] + '</button>').join("") + '</div>';
    return b;
  }

  function sheetDiaper() {
    const sub = { wet: "يُحفظ فوراً بضغطة واحدة", dirty: "يمكنك إضافة اللون", mixed: "يمكنك إضافة اللون" };
    let b = '<div class="kinds">' + Object.keys(DKIND).map((k) =>
      '<button class="kind' + (D.kind === k ? " on" : "") + '" data-act="diaper-kind" data-val="' + k + '">' + DICON[k] + '<span>' + DKIND[k] + '<small>' + sub[k] + '</small></span></button>').join("") + '</div>';
    if (D.kind && D.kind !== "wet") {
      b += stoolFields();
      b += '<textarea id="f-note" data-bind="note" placeholder="ملاحظة (اختياري)">' + esc(D.note) + '</textarea>';
    }
    b += whenPicker("var(--diaper)");
    return frame("حفاض", b, D.kind && D.kind !== "wet" ? saveBtn("var(--diaper)") : "");
  }

  function sheetAddSleep() {
    const s = fromLocalInput(D.start, 0), e = fromLocalInput(D.end, 0);
    const b = timeField("start", "نام", D.start) + timeField("end", "استيقظ", D.end) +
      '<p class="hint">المدة: <span class="num" data-live="dur">' + (e > s ? dur((e - s) / 1000) : "—") + '</span></p>';
    return frame("إضافة نوم سابق", b, saveBtn("var(--sleep)", "حفظ"));
  }

  function sheetLog() {
    const items = allItems();
    let b = '<button class="ghost" data-act="open" data-sheet="addsleep">' + I.moon + 'إضافة نوم نسيتِ تسجيله</button>';
    if (!items.length) b += '<p class="empty">لا توجد سجلات بعد.</p>';
    const days = [];
    items.forEach((it) => { const d = startOfDay(it.t); if (!days.length || days[days.length - 1].d !== d) days.push({ d, items: [] }); days[days.length - 1].items.push(it); });
    days.forEach((g) => {
      const st = dayStats(g.d);
      b += '<section class="day"><div class="day-h"><b>' + dayTitle(g.d) + '</b><span>' +
        dg(st.feeds.length) + ' رضعات · ' + dg(st.diapers.length) + ' حفاضات · نوم ' + dur(st.sleep) + '</span></div><div class="rows">' +
        g.items.map((it) => rowHtml(it, false)).join("") + '</div></section>';
    });
    return frame("السجل", b, "");
  }

  function sheetEdit() {
    const e = findEntry(sheet.type, sheet.id);
    if (!e) return frame("تعديل", '<p class="empty">هذا السجل لم يعد موجوداً.</p>', "");
    let b = "", title = rowInfo(sheet.type, e).title;
    if (sheet.type === "feed") {
      b += timeField("time", "البداية", D.time);
      if (e.kind === "nursing" && e.end != null) b += minStepper("rmin", "var(--nursing)", "الجهة اليمنى", 1) + minStepper("lmin", "var(--nursing)", "الجهة اليسرى", 1);
      if (e.kind === "nursing" && e.end == null) b += '<p class="hint">الرضعة ما زالت جارية. يمكنك تعديلها من المؤقت.</p>';
      if (e.kind === "bottle") b += seg("content", [["breastMilk", "حليب الأم"], ["formula", "حليب صناعي"]], "var(--bottle)") + stepper("ml", "var(--bottle)", "الكمية");
      if (e.kind === "pump") b += stepper("rml", "var(--pump)", "الجهة اليمنى") + stepper("lml", "var(--pump)", "الجهة اليسرى") + minStepper("mins", "var(--pump)", "المدة", 5);
    } else if (sheet.type === "diaper") {
      title = "حفاض";
      b += seg("kind", [["wet", "مبلل"], ["dirty", "متسخ"], ["mixed", "الاثنان"]], "var(--diaper)") + timeField("time", "الوقت", D.time);
      if (D.kind !== "wet") b += stoolFields();
    } else {
      b += timeField("time", "نام", D.time);
      b += e.end != null ? timeField("endTime", "استيقظ", D.endTime) : '<p class="hint">ما زال نائماً الآن.</p>';
    }
    b += '<textarea id="f-note" data-bind="note" placeholder="ملاحظة (اختياري)">' + esc(D.note || "") + '</textarea>';
    const foot = saveBtn("var(--sleep)", "حفظ التعديل") + '<button class="danger" data-act="delete">حذف هذا السجل</button>';
    return frame("تعديل: " + title, b, foot);
  }

  function sheetSettings() {
    const b = '<div class="field col"><label for="f-baby">اسم الطفل</label><input id="f-baby" data-bind="baby" value="' + esc(D.baby) + '"></div>' +
      '<div class="field"><label for="f-birth">تاريخ الميلاد</label><input id="f-birth" type="date" data-bind="birth" value="' + esc(D.birth) + '" max="' + toLocalInput(now()).slice(0, 10) + '"></div>' +
      '<div class="field col"><label for="f-mother">اسم الأم</label><input id="f-mother" data-bind="mother" value="' + esc(D.mother) + '"></div>' +
      '<p class="label">وحدة الكمية</p>' + seg("unit", [["ml", "مل"], ["oz", "أونصة"]], "var(--sleep)") +
      '<p class="label">المظهر</p>' + seg("theme", [["system", "تلقائي"], ["dark", "ليلي"], ["light", "نهاري"]], "var(--sleep)") +
      '<p class="subtle">الوضع الليلي أسود بالكامل وخافت حتى لا يزعج الإضاءة أثناء رضعات الليل.</p>' +
      '<p class="label">نسخة احتياطية</p>' +
      '<button class="ghost" data-act="backup">نسخ كل البيانات</button>' +
      '<textarea id="f-restore" data-bind="restore" placeholder="لاسترجاع نسخة، الصقيها هنا"></textarea>' +
      '<button class="ghost" data-act="restore">استرجاع النسخة الملصقة</button>' +
      '<p class="subtle">البيانات محفوظة على هذا الهاتف فقط. انسخي نسخة احتياطية واحفظيها في الملاحظات من وقت لآخر.</p>' +
      '<p class="label">البدء من جديد</p>' + confirmBtn("wipe", "مسح كل السجلات") +
      '<p class="subtle">يمكن التراجع عن المسح مباشرة بعده.</p>';
    return frame("الإعدادات", b, saveBtn("var(--sleep)", "حفظ الإعدادات"));
  }

  // ---------- Actions ----------
  function addEntry(list, entry, label) { change(label, () => S[list].push(entry)); }

  function doSave() {
    const s = sheet;
    if (s.name === "nursing") {
      const f = activeNursing(); if (!f) return closeSheet();
      change("حُفظت الرضعة (" + dur(totalSecs(f, now())) + ")", () => { const t = now(); pauseFeed(f, t); f.end = t; });
      return closeSheet();
    }
    if (s.name === "bottle") {
      const at = whenTime();
      addEntry("feeds", { id: uid(), kind: "bottle", start: at, end: at, ml: D.ml, content: D.content, note: "" }, "حُفظت رضّاعة " + vol(D.ml));
      return closeSheet();
    }
    if (s.name === "pump") {
      const at = whenTime();
      addEntry("feeds", { id: uid(), kind: "pump", start: at, end: at + D.mins * 60000, rml: D.rml, lml: D.lml, note: "" }, "حُفظ الشفط " + vol(D.rml + D.lml));
      return closeSheet();
    }
    if (s.name === "diaper") return saveDiaper();
    if (s.name === "addsleep") {
      const a = fromLocalInput(D.start, 0), b = fromLocalInput(D.end, 0);
      if (!(b > a)) return toast("وقت الاستيقاظ يجب أن يكون بعد وقت النوم");
      addEntry("sleeps", { id: uid(), start: a, end: b, note: "" }, "حُفظ نوم " + dur((b - a) / 1000));
      return openSheet("log", { from: "home" });
    }
    if (s.name === "settings") {
      change("تغيير الإعدادات", () => Object.assign(S.settings, { baby: (D.baby || "").trim() || "مالك", mother: (D.mother || "").trim(), birth: D.birth || "", unit: D.unit, theme: D.theme }));
      applyTheme(); return closeSheet();
    }
    if (s.name === "edit") {
      const e = findEntry(s.type, s.id); if (!e) return openSheet("log");
      if (s.type === "sleep" && e.end != null) {
        const a = fromLocalInput(D.time, e.start), b = fromLocalInput(D.endTime, e.end);
        if (!(b > a)) return toast("وقت الاستيقاظ يجب أن يكون بعد وقت النوم");
      }
      change("تعديل " + rowInfo(s.type, e).title, () => {
        e.note = (D.note || "").trim();
        if (s.type === "feed") {
          e.start = fromLocalInput(D.time, e.start);
          if (e.kind === "nursing" && e.end != null) { e.r = (D.rmin || 0) * 60; e.l = (D.lmin || 0) * 60; e.end = e.start + (e.r + e.l) * 1000; }
          if (e.kind === "bottle") { e.ml = D.ml; e.content = D.content; e.end = e.start; }
          if (e.kind === "pump") { e.rml = D.rml; e.lml = D.lml; e.end = e.start + (D.mins || 0) * 60000; }
        } else if (s.type === "diaper") {
          e.t = fromLocalInput(D.time, e.t); e.kind = D.kind;
          e.color = D.kind === "wet" ? null : D.color; e.cons = D.kind === "wet" ? null : D.cons;
        } else {
          e.start = fromLocalInput(D.time, e.start);
          if (e.end != null) e.end = fromLocalInput(D.endTime, e.end);
        }
      });
      return s.from === "log" ? openSheet("log", { from: "home" }) : closeSheet();
    }
  }
  function saveDiaper() {
    const at = whenTime(), kind = D.kind;
    addEntry("diapers", { id: uid(), t: at, kind, color: kind === "wet" ? null : D.color, cons: kind === "wet" ? null : D.cons, note: (D.note || "").trim() }, "حُفظ حفاض " + DKIND[kind]);
    closeSheet();
  }

  function onConfirmed(key) {
    if (key === "cancel-nurse") {
      const f = activeNursing();
      if (f) change("إلغاء الرضعة", () => { S.feeds = S.feeds.filter((x) => x !== f); });
      return closeSheet();
    }
    if (key === "wipe") {
      change("مسح كل السجلات", () => { S.feeds = []; S.diapers = []; S.sleeps = []; });
      return closeSheet();
    }
  }

  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-act]"); if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    if (act !== "confirm" && confirmKey) confirmKey = null;
    switch (act) {
      case "undo": return undo();
      case "open": return openSheet(btn.dataset.sheet, { from: sheet ? sheet.name : "home" });
      case "close": return sheet && sheet.from === "log" ? openSheet("log", { from: "home" }) : closeSheet();
      case "toggle-night":
        S.settings.theme = isDark() ? "light" : "dark"; save(); applyTheme(); return renderHome();
      case "toggle-sleep": {
        const sl = activeSleep(), name = S.settings.baby;
        if (sl) change("استيقظ " + name + " بعد " + dur((now() - sl.start) / 1000), () => { sl.end = now(); });
        else change("نام " + name + " الآن", () => S.sleeps.push({ id: uid(), start: now(), end: null, note: "" }));
        return renderHome();
      }
      case "nurse-side": {
        const side = btn.dataset.side, f0 = activeNursing();
        const label = !f0 ? "بدء الرضاعة من " + SIDE[side] : f0.run === side ? "إيقاف مؤقت" : "تبديل إلى " + SIDE[side];
        change(label, () => {
          const t = now(); let f = activeNursing();
          if (!f) { f = { id: uid(), kind: "nursing", start: t, end: null, r: 0, l: 0, run: null, since: null, last: null, note: "" }; S.feeds.push(f); }
          if (f.run === side) pauseFeed(f, t);
          else { pauseFeed(f, t); if (f.r === 0 && f.l === 0) f.start = t; f.run = side; f.since = t; f.last = side; }
        });
        return renderSheet();
      }
      case "nurse-reset": {
        change("تصفير المؤقت", () => { const f = activeNursing(); if (f) { const t = now(); f.r = 0; f.l = 0; f.start = t; if (f.run) f.since = t; } });
        return renderSheet();
      }
      case "nurse-swap": {
        change("تبديل الجهتين", () => {
          const f = activeNursing(); if (!f) return;
          const t = now(); const wasRunning = f.run; pauseFeed(f, t);
          const r = f.r; f.r = f.l; f.l = r;
          if (wasRunning) { f.run = other(wasRunning); f.since = t; f.last = f.run; } else if (f.last) f.last = other(f.last);
        });
        return renderSheet();
      }
      case "step": {
        const u = unitInfo(), k = btn.dataset.key;
        const v = Math.max(0, Math.round((u.from(D[k] || 0) + u.step * Number(btn.dataset.dir)) / u.step) * u.step);
        D[k] = u.to(v); return renderSheet();
      }
      case "minkey": D[btn.dataset.key] = Math.max(0, Math.min(180, (D[btn.dataset.key] || 0) + Number(btn.dataset.dir))); return renderSheet();
      case "set": D[btn.dataset.key] = btn.dataset.str ? btn.dataset.val : Number(btn.dataset.val); return renderSheet();
      case "toggle": D[btn.dataset.key] = D[btn.dataset.key] === btn.dataset.val ? null : btn.dataset.val; return renderSheet();
      case "diaper-kind":
        D.kind = btn.dataset.val;
        if (D.kind === "wet") return saveDiaper();
        return renderSheet();
      case "save": return doSave();
      case "edit": return openSheet("edit", { type: btn.dataset.type, id: btn.dataset.id, from: sheet && sheet.name === "log" ? "log" : "home" });
      case "delete": {
        const e = findEntry(sheet.type, sheet.id), from = sheet.from;
        if (e) {
          const list = sheet.type === "feed" ? "feeds" : sheet.type === "diaper" ? "diapers" : "sleeps", id = sheet.id;
          change("حُذف: " + rowInfo(sheet.type, e).title, () => { S[list] = S[list].filter((x) => x.id !== id); });
        }
        return from === "log" ? openSheet("log", { from: "home" }) : closeSheet();
      }
      case "confirm": {
        const k = btn.dataset.key;
        if (confirmKey === k) { confirmKey = null; clearTimeout(confirmTimer); return onConfirmed(k); }
        confirmKey = k; clearTimeout(confirmTimer);
        confirmTimer = setTimeout(() => { confirmKey = null; renderSheet(); }, 4000);
        return renderSheet();
      }
      case "backup": {
        const text = JSON.stringify({ v: S.v, feeds: S.feeds, diapers: S.diapers, sleeps: S.sleeps, settings: S.settings });
        const fallback = () => { D.restore = text; renderSheet(); const ta = document.getElementById("f-restore"); if (ta) { ta.value = text; ta.focus(); ta.select(); } toast("حدّدي النص وانسخيه"); };
        try { navigator.clipboard.writeText(text).then(() => toast("نُسخت البيانات. الصقيها في الملاحظات"), fallback); } catch (e) { fallback(); }
        return;
      }
      case "restore": {
        let d;
        try { d = JSON.parse(D.restore || ""); } catch (e) { d = null; }
        if (!d || !Array.isArray(d.feeds) || !Array.isArray(d.diapers) || !Array.isArray(d.sleeps)) return toast("النص الملصق ليس نسخة صالحة");
        change("استرجاع نسخة احتياطية", () => { S = normalize(d); });
        applyTheme(); return closeSheet();
      }
    }
  });
  document.addEventListener("input", (ev) => {
    const el = ev.target; if (!el.dataset || !el.dataset.bind) return;
    D[el.dataset.bind] = el.value;
    if (sheet && sheet.name === "addsleep") {
      const s = fromLocalInput(D.start, 0), e = fromLocalInput(D.end, 0);
      const out = document.querySelector('[data-live="dur"]'); if (out) out.textContent = e > s ? dur((e - s) / 1000) : "—";
    }
  });

  // ---------- Ticking clocks ----------
  setInterval(() => {
    const t = now(), f = activeNursing(), sl = activeSleep();
    document.querySelectorAll('[data-tick="nurse"]').forEach((el) => (el.textContent = clock(f ? totalSecs(f, t) : 0)));
    document.querySelectorAll('[data-tick="sleep"]').forEach((el) => (el.textContent = sl ? clock((t - sl.start) / 1000) : ""));
    ["right", "left"].forEach((side) => document.querySelectorAll('[data-tick="side-' + side + '"]').forEach((el) => (el.textContent = clock(f ? sideSecs(f, side, t) : 0))));
  }, 1000);
  setInterval(() => { if (!sheet) renderHome(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { S = load(); applyTheme(); if (sheet) renderSheet(); else renderHome(); } });
  if (window.matchMedia) { try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyTheme(); if (!sheet) renderHome(); }); } catch (e) {} }

  applyTheme();
  renderHome();
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
</html>
